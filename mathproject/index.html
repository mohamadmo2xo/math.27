<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري التحميل...</title>
<meta http-equiv="refresh" content="0; url=website/">
<script>window.location.replace('website/');</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #0a0a1a, #1a0b2e, #16213e, #0f3460);
    background-size: 400% 400%;
    animation: bgShift 5s ease infinite;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #f8fafc;
    text-align: center;
    padding: 20px;
  }
  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.15);
    border-top-color: #818cf8;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loader p {
    font-size: 1rem;
    color: rgba(255, 255, 255, 0.75);
    font-weight: 600;
  }
  .loader a {
    color: #a5b4fc;
    text-decoration: none;
    font-weight: 700;
    border-bottom: 1px dashed #a5b4fc;
  }
</style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>جاري التحميل...</p>
    <p style="font-size: 0.85rem;">
      إذا لم يتم التحويل تلقائيًا،
      <a href="website/">اضغط هنا</a>
    </p>
  </div>
</body>
</html>
