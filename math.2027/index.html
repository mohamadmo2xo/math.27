<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري التحميل...</title>
<meta http-equiv="refresh" content="0; url=website/">
<script>window.location.replace('website/');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(-45deg,#0a0a1a,#1a0b2e,#16213e,#0f3460);
background-size:400% 400%;animation:bg 5s ease infinite;
font-family:'Segoe UI',Tahoma,sans-serif;color:#f8fafc;text-align:center;padding:20px}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,.15);
border-top-color:#818cf8;border-radius:50%;animation:spin .9s linear infinite;
margin:0 auto 20px;box-shadow:0 0 30px rgba(99,102,241,.5)}
@keyframes spin{to{transform:rotate(360deg)}}
a{color:#a5b4fc;text-decoration:none;border-bottom:1px dashed #a5b4fc}
</style>
</head>
<body>
<div>
  <div class="spinner"></div>
  <p>جاري التحميل...</p>
  <p style="font-size:.85rem;margin-top:10px">
    إذا لم يتم التحويل، <a href="website/">اضغط هنا</a>
  </p>
</div>
</body>
</html>
